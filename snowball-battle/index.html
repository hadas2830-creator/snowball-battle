<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קרב כדורי שלג</title>
<meta name="description" content="משחק כדורי שלג מהיר לשני שחקנים, כל אחד מהמחשב שלו">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%84%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" aria-hidden="true"></div>

  <!-- מסך פתיחה -->
  <section id="home" class="screen active">
    <div class="card home-card">
      <div class="logo">
        <span class="flake">❄</span>
        <h1>קרב כדורי שלג</h1>
        <p class="tag">2–3 שחקנים · כל אחד מהמחשב שלו · הרבה שלג</p>
      </div>

      <label class="field">
        <span>איך קוראים לך?</span>
        <input id="name" maxlength="12" autocomplete="nickname" placeholder="למשל: שלגיה">
      </label>


      <button id="btn-create" class="btn primary big">יצירת חדר חדש</button>
      <button id="btn-bot" class="btn big bot-btn">🤖 אימון נגד המחשב</button>

      <div class="divider"><span>או הצטרפות לחדר פתוח</span></div>

      <ul id="rooms" class="rooms" aria-live="polite">
        <li class="rooms-empty">מחפשים חדרים פתוחים…</li>
      </ul>

      <p id="home-msg" class="msg" role="alert"></p>
      <p id="touch-note" class="hint-line" hidden>💻 המשחק עובד הכי טוב במחשב עם מקלדת ועכבר</p>

      <button id="btn-rules" class="btn rules-btn" type="button">📖 הוראות המשחק</button>
    </div>
  </section>

  <!-- חלון הוראות -->
  <template id="rules-tpl">
    <div class="card rules-card">
      <h2>📖 איך משחקים?</h2>
      <div class="rules">
        <h3>🎯 המטרה</h3>
        <p>לפגוע בשאר השחקנים בכדורי שלג. כל אחד לעצמו – <b>הראשון שפוגע 5 פעמים מנצח</b> 🏆</p>

        <h3>⌨️ שליטה</h3>
        <ul>
          <li><b>חצים</b> או <b>W A S D</b> – לזוז</li>
          <li><b>רווח</b> – לזרוק (אפשר להחזיק). הכדור עף לכיוון שהולכים – החץ הלבן הקטן מראה לאן</li>
        </ul>

        <h3>⛄ כדורים ומכונה</h3>
        <ul>
          <li>כל אחד מתחיל עם <b>10 כדורים</b>. המונה בפינה למטה מראה כמה נשארו</li>
          <li>כשנשארים <b>3 כדורים או פחות</b> – הולכים ל<b>מכונת הכדורים</b> ועומדים לידה עד שמתמלא ל-10</li>
          <li>עם יותר מ-3 כדורים <b>המכונה כבויה ואפורה</b>. כשהיא נדלקת וחוזרת לצבע כחול – אפשר להטעין!</li>
          <li>בזמן הטעינה את חשופה – זהירות 😉</li>
        </ul>

        <h3>🌲 הזירה</h3>
        <ul>
          <li>מתחבאים מאחורי עצים, אנשי שלג, הבקתה והחומות – הכדורים נעצרים בהם</li>
          <li>על האגמים הקפואים <b>מחליקים</b> – קשה לעצור!</li>
          <li>מי שנפגע <b>קופא</b> לרגע בתוך גוש קרח</li>
        </ul>

        <h3>🎁 בונוסים (מופיעים מדי פעם)</h3>
        <ul>
          <li><span class="b-big">כדור ענק</span> – 3 כדורים גדולים שקשה להתחמק מהם</li>
          <li><span class="b-triple">זריקה משולשת</span> – 3 זריקות של שלושה כדורים בבת אחת</li>
          <li><span class="b-shield">מגן קרח</span> – 5 שניות שאף כדור לא פוגע בך</li>
        </ul>

        <h3>👥 משחק עם חברים</h3>
        <ul>
          <li>אחד לוחץ <b>"יצירת חדר חדש"</b>, והחדר מופיע אצל כולם ברשימת <b>החדרים הפתוחים</b></li>
          <li>שאר השחקנים לוחצים <b>"הצטרפות"</b> ליד החדר</li>
          <li>2 או 3 שחקנים. מי שפתח את החדר לוחץ <b>"התחלת משחק"</b></li>
          <li>כל שחקן מקבל בובה אקראית</li>
        </ul>

        <h3>🤖 אימון נגד המחשב</h3>
        <p>משחק לבד נגד "רובוט השלג" – הוא מתחמק ומכוון טוב! טיפ: לזרוק לאן שהוא הולך, ולהתקרב אליו.</p>
      </div>
      <div class="btns"><button class="btn primary" id="btn-rules-close" type="button">הבנתי, בואו נשחק!</button></div>
    </div>
  </template>

  <!-- מסך המתנה -->
  <section id="waiting" class="screen">
    <div class="card wait-card">
      <h2 id="wait-title">החדר שלך מוכן!</h2>
      <p class="sub">קוד החדר:</p>
      <div id="room-code" class="room-code" dir="ltr">0000</div>
      <ul id="plist" class="plist" aria-label="מי בחדר"></ul>
      <p id="wait-sub" class="sub">תגידו לחברים את הקוד</p>
      <button id="btn-start" class="btn primary big" hidden>התחלת משחק</button>
      <button id="btn-copy" class="btn">📋 העתקת קישור לחדר</button>
      <button id="btn-back" class="btn ghost">חזרה</button>
    </div>
  </section>

  <!-- מסך משחק (הזירה עצמה מצוירת ברקע) -->
  <section id="game" class="screen">
    <div id="hud"></div>
    <div id="countdown" aria-live="polite"></div>
    <div id="power"><span class="picon"></span><span class="ptext"></span></div>
    <div id="hint">חצים / WASD לזוז · רווח לזרוק</div>
    <div id="ammo" aria-live="polite"><span class="aballs"></span><span class="atext"></span></div>
  </section>

  <div id="overlay" class="overlay" role="dialog" aria-modal="true"></div>
  <div id="toast" role="status"></div>
  <button id="mute" class="icon-btn" type="button">🔊</button>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="assets.js"></script>
  <script src="arena-img.js"></script>
  <script src="dolls-img.js"></script>
  <script src="audio.js"></script>
  <script src="net.js"></script>
  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
